name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: checks
    env:
      ZENO_TEST_DB: '1'
      APP_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Compute branch expiry
        id: expiry
        # Safety net if the delete step never runs (cancelled/crashed job).
        run: echo "at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: production
          branch_name: ci-${{ github.run_id }}
          expires_at: ${{ steps.expiry.outputs.at }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Export branch env
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          CI_BRANCH: ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          trap 'rm -f .env.ci' EXIT
          npx -y neon@8.4.1 env pull --project-id "$NEON_PROJECT_ID" --branch "$CI_BRANCH" --file .env.ci
          node <<'JS'
          const fs = require('node:fs')
          const { parseEnv } = require('node:util')
          const { randomUUID } = require('node:crypto')

          // Values that are safe to show in logs; everything else is masked.
          const UNMASKED = new Set(['NEON_BRANCH'])
          const env = parseEnv(fs.readFileSync('.env.ci', 'utf8'))

          if (env.NEON_BRANCH !== process.env.CI_BRANCH) {
            console.error(`NEON_BRANCH mismatch: expected ${process.env.CI_BRANCH}`)
            process.exit(1)
          }

          const mask = (value) => {
            for (const line of value.split(/\r?\n/)) {
              if (line.trim()) console.log(`::add-mask::${line}`)
            }
          }

          let out = ''
          for (const [key, value] of Object.entries(env)) {
            if (!UNMASKED.has(key)) mask(value)
            if (/^postgres(ql)?:\/\//i.test(value)) {
              try {
                const { password } = new URL(value)
                if (password) {
                  mask(password)
                  mask(decodeURIComponent(password))
                }
              }
              catch {
                // Not a parseable URL; the whole value is already masked.
              }
            }
            const delimiter = `ZENO_EOF_${randomUUID()}`
            out += `${key}<<${delimiter}\n${value}\n${delimiter}\n`
          }
          fs.appendFileSync(process.env.GITHUB_ENV, out)
          JS
      - run: test ! -f drizzle/meta/_journal.json || npx drizzle-kit migrate
      - run: test ! -f drizzle/meta/_journal.json || npx drizzle-kit check
      - run: npx vitest run --project integration
      - run: npx vitest run --project api
      - if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

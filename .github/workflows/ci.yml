name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:runtime
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:functions
      - run: npm run typecheck:hardening
      - run: npm run test:unit
      - run: npm run test:nuxt
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - slot: integration-1
            project: integration
            shard: 1/2
          - slot: integration-2
            project: integration
            shard: 2/2
          - slot: api
            project: api
            shard: 1/1
          - slot: hardening
            project: hardening
            shard: 1/1
          - slot: browser
            project: browser
            shard: 1/1
    env:
      ZENO_TEST_DB: '1'
      APP_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate APP_ENCRYPTION_KEY
        run: |
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "APP_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - name: Compute branch expiry
        id: expiry
        # Safety net if the delete step never runs (cancelled/crashed job).
        run: echo "at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: production
          branch_type: schema-only
          branch_name: ci-${{ github.run_id }}-${{ matrix.slot }}
          expires_at: ${{ steps.expiry.outputs.at }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Export branch env
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          CI_BRANCH: ci-${{ github.run_id }}-${{ matrix.slot }}
        run: |
          set -euo pipefail
          trap 'rm -f .env.ci' EXIT
          npx -y neon@8.4.1 env pull --project-id "$NEON_PROJECT_ID" --branch "$CI_BRANCH" --file .env.ci --service postgres --service auth --service object-storage
          node <<'JS'
          const fs = require('node:fs')
          const { parseEnv } = require('node:util')
          const { randomUUID } = require('node:crypto')

          // Values that are safe to show in logs; everything else is masked.
          const UNMASKED = new Set(['NEON_BRANCH'])
          const env = parseEnv(fs.readFileSync('.env.ci', 'utf8'))

          if (env.NEON_BRANCH !== process.env.CI_BRANCH) {
            console.error(`NEON_BRANCH mismatch: expected ${process.env.CI_BRANCH}`)
            process.exit(1)
          }

          const mask = (value) => {
            for (const line of value.split(/\r?\n/)) {
              if (line.trim()) console.log(`::add-mask::${line}`)
            }
          }

          let out = ''
          for (const [key, value] of Object.entries(env)) {
            if (!UNMASKED.has(key)) mask(value)
            if (/^postgres(ql)?:\/\//i.test(value)) {
              try {
                const { password } = new URL(value)
                if (password) {
                  mask(password)
                  mask(decodeURIComponent(password))
                }
              }
              catch {
                // Not a parseable URL; the whole value is already masked.
              }
            }
            const delimiter = `ZENO_EOF_${randomUUID()}`
            out += `${key}<<${delimiter}\n${value}\n${delimiter}\n`
          }
          fs.appendFileSync(process.env.GITHUB_ENV, out)
          JS
      - name: Rebuild app schemas on the attested empty CI branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          CI_BRANCH: ci-${{ github.run_id }}-${{ matrix.slot }}
        run: npx tsx scripts/reset-ci-schema.ts
      - run: test ! -f drizzle/meta/_journal.json || npx drizzle-kit migrate
      - run: test ! -f drizzle/meta/_journal.json || npx drizzle-kit check
      - name: Payment burst smoke regression
        if: matrix.slot == 'integration-1'
        run: npx vitest run --project integration tests/integration/match-transaction.test.ts -t 'a burst across several orders'
      - if: matrix.slot == 'hardening' || matrix.slot == 'browser'
        run: npm run build:hardening
      - if: matrix.slot != 'browser'
        run: npx vitest run --project ${{ matrix.project }} --shard=${{ matrix.shard }}
      - if: matrix.slot == 'browser'
        run: npx playwright install --with-deps chromium webkit
      - if: matrix.slot == 'browser'
        run: npm run test:e2e:hardening
      - name: Production browser journeys on three projects
        if: matrix.slot == 'browser'
        env:
          INVITE_REQUIRE_VERIFIED_EMAIL: 'false'
        run: npx playwright test --config playwright.production.config.ts
      - if: always() && (matrix.slot == 'hardening' || matrix.slot == 'browser')
        uses: actions/upload-artifact@v4
        with:
          name: pr7-${{ matrix.slot }}-reports
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}-${{ matrix.slot }}
          api_key: ${{ secrets.NEON_API_KEY }}

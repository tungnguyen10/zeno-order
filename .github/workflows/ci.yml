name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:runtime
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:functions
      - run: npm run typecheck:hardening
      - run: npm run test:unit
      - run: npm run test:nuxt
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      # Collect independent DB/API results even when a provider browser gate fails.
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - slot: hardening
            project: hardening
            shard: 1/1
          - slot: browser
            project: browser
            shard: 1/1
          - slot: integration-1
            project: integration
            shard: 1/2
          - slot: integration-2
            project: integration
            shard: 2/2
          - slot: api
            project: api
            shard: 1/1
    env:
      ZENO_TEST_DB: '1'
      APP_BASE_URL: ${{ matrix.slot == 'browser' && 'https://localhost:3100' || 'http://localhost:3100' }}
      CI_BRANCH: ci-${{ github.run_id }}-${{ matrix.slot }}
      CI_TEST_AUTH_BRANCH: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create local TLS certificate for Secure browser cookies
        if: matrix.slot == 'browser'
        run: |
          mkdir -p .cache/ci-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' -keyout .cache/ci-tls/key.pem -out .cache/ci-tls/cert.pem 2>/dev/null
          echo "NODE_EXTRA_CA_CERTS=$PWD/.cache/ci-tls/cert.pem" >> "$GITHUB_ENV"
          echo 'CI_BROWSER_TLS=1' >> "$GITHUB_ENV"
      - name: Generate APP_ENCRYPTION_KEY
        run: |
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          echo "APP_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"
      - name: Compute branch expiry
        id: expiry
        # Safety net if the delete step never runs (cancelled/crashed job).
        run: echo "at=$(date -u -d '+2 hours' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: neondatabase/create-branch-action@v6
        id: neonbranch
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: production
          branch_type: schema-only
          branch_name: ci-${{ github.run_id }}-${{ matrix.slot }}
          expires_at: ${{ steps.expiry.outputs.at }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Export branch env
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          CI_BRANCH: ci-${{ github.run_id }}-${{ matrix.slot }}
        run: node scripts/export-ci-env.mjs postgres
      - name: Rebuild app schemas on the attested empty CI branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          CI_BRANCH: ci-${{ github.run_id }}-${{ matrix.slot }}
        run: npx tsx scripts/reset-ci-schema.ts
      - run: test ! -f drizzle/meta/_journal.json || npx drizzle-kit migrate
      - run: test ! -f drizzle/meta/_journal.json || npx drizzle-kit check
      - name: Provision isolated storage after app schema rebuild
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: node scripts/provision-ci-services.mjs
      - name: Export provisioned branch services
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: node scripts/export-ci-env.mjs postgres object-storage
      - name: Bind designated non-production test Auth for browser journeys
        id: testauth
        if: matrix.slot == 'browser'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: node scripts/shared-ci-auth.mjs bind
      - name: Payment burst smoke regression
        if: matrix.slot == 'integration-1'
        run: npx vitest run --project integration tests/integration/match-transaction.test.ts -t 'a burst across several orders'
      - if: matrix.slot == 'hardening' || matrix.slot == 'browser'
        id: hardeningbuild
        run: npm run build:hardening
      - if: matrix.slot != 'browser'
        run: npx vitest run --project ${{ matrix.project }} --shard=${{ matrix.shard }}
      - if: matrix.slot == 'browser'
        id: browsers
        run: npx playwright install --with-deps chromium webkit
      - if: matrix.slot == 'browser'
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/hardening
        run: npm run test:e2e:hardening -- --output=test-results/hardening
      - name: Production browser journeys on three projects
        # Run both browser gates even if the first suite fails; neither failure is ignored.
        if: ${{ !cancelled() && matrix.slot == 'browser' && steps.testauth.outcome == 'success' && steps.hardeningbuild.outcome == 'success' && steps.browsers.outcome == 'success' }}
        env:
          INVITE_REQUIRE_VERIFIED_EMAIL: 'false'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/production
        run: npx playwright test --config playwright.production.config.ts --output=test-results/production
      - name: Clean only this run's synthetic test Auth users
        if: always() && matrix.slot == 'browser' && steps.testauth.outcome == 'success'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: node scripts/shared-ci-auth.mjs cleanup
      - if: always() && (matrix.slot == 'hardening' || matrix.slot == 'browser')
        uses: actions/upload-artifact@v4
        with:
          name: pr7-${{ matrix.slot }}-reports
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - if: always() && steps.neonbranch.outcome == 'success'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ci-${{ github.run_id }}-${{ matrix.slot }}
          api_key: ${{ secrets.NEON_API_KEY }}
